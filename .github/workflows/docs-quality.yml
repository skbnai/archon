name: docs-quality
on:
  pull_request:
    paths: ["docs/**", "governance/**", "scripts/**"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Frontmatter (changed files)
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }} -- 'docs/**/*.md')
          for f in $CHANGED; do
            [ -f "$f" ] && { echo "== $f"; python3 scripts/validate_frontmatter.py "$f"; }
          done
      - name: Registry consistency
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED_MD=$(git diff --name-only origin/${{ github.base_ref }} -- 'docs/**/*.md')
          if [ -n "$CHANGED_MD" ]; then
            # stage-04 lands one domain per PR; only that domain's registry
            # entries are expected to have canonical files on disk. Other
            # domains are future waves -- don't fail this PR for them.
            CHANGED_DOMAINS=$(echo "$CHANGED_MD" | sed -E 's#^docs/([a-z-]+)/.*#\1#' | sort -u | paste -sd, -)
            echo "changed domains: $CHANGED_DOMAINS"
            python3 scripts/registry_check.py --domains "$CHANGED_DOMAINS"
          else
            echo "no docs pages changed in this PR -- registry-only update, running --paper mode"
            python3 scripts/registry_check.py --paper
          fi
      - name: Near-duplicate gate
        run: python3 scripts/dedup_check.py --all 0.55
      - name: Forbidden filename patterns
        run: |
          BAD=$(find docs -name '*_v[0-9]*' -o -name '*_final*' -o -name '*_copy*' \
                -o -name '*-old*' -o -name '*_new*' | grep . || true)
          if [ -n "$BAD" ]; then echo "$BAD"; echo "::error::versioned filenames forbidden"; exit 1; fi
      - name: Compute pending-domain link excludes
        id: pending
        run: |
          # A page finished in an earlier wave may legitimately link forward
          # to a topic that's registered but not yet migrated (future wave).
          # Don't fail the link check on those -- only on links into domains
          # that are supposed to be fully present already.
          EXCLUDES=$(python3 scripts/registry_check.py --pending-domains)
          echo "excludes=$EXCLUDES" >> "$GITHUB_OUTPUT"
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress ${{ steps.pending.outputs.excludes }} "docs/**/*.md"
          fail: true
