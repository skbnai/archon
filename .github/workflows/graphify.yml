name: graphify
permissions:
  contents: write
on:
  pull_request:
    paths: ["docs/**", "governance/technology-taxonomy.json", "sidebars.js"]
  push:
    branches: [main]
    paths: ["docs/**", "governance/technology-taxonomy.json", "sidebars.js"]
  workflow_dispatch: {}
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install pyyaml scikit-learn
      - name: Build graph
        run: python3 .claude/skills/graphify/scripts/build_graph.py --sim-threshold 0.3
      - name: Deep duplicate gate (cross-domain clusters)
        run: |
          python3 .claude/skills/graphify/scripts/query_graph.py --duplicates --min 0.6 > duplicates.txt
          cat duplicates.txt
          if grep -q "CROSS-DOMAIN" duplicates.txt; then
            echo "::error::Cross-domain duplicate-candidate cluster(s) found — see job log. Resolve via the dedup-canonicalization skill before merging."
            exit 1
          fi
      - name: Build section indexes
        run: python3 .claude/skills/graphify/scripts/build_section_indexes.py
      - name: Build explorer (main only — publish artifact)
        if: github.ref == 'refs/heads/main'
        run: python3 .claude/skills/graphify/scripts/build_explorer.py
      - name: Commit generated manifests (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "archon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _meta/graph.json _meta/duplicate-clusters.md \
                  _meta/knowledge-graph-explorer.html "docs/*/_index.json"
          git diff --cached --quiet || git commit -m "chore(graphify): refresh graph, indexes, explorer [skip ci]"
          git push
