# Single source of truth: topic -> canonical page.
# ONLY the librarian agent edits this file. Validated by scripts/registry_check.py.
# A docs/ page that is not listed here cannot be created (PreToolUse hook) and
# cannot merge (CI).
#
# Entry shape:
# - id: mcp-overview                      # stable topic id
#   domain: protocols
#   canonical: docs/protocols/01-mcp-overview.md
#   aliases: [model context protocol]
#   supersedes:                            # old-repo paths absorbed by this topic
#     - docs/ai-protocols/mcp/MCP_Deep_Research_2026.md
#   pages: []                              # registered non-canonical spokes
#   pending: true                          # optional; see below
#
# `pending: true` — for domains whose migration.csv mapping is too big for one
# PR/wave and lands in several batches. A topic pre-registered for a batch
# that hasn't landed yet keeps this flag, which exempts it from
# registry_check.py's "canonical file missing" check even while its domain is
# in --domains scope for the batch that IS landing. Remove the flag in the
# same PR that creates the topic's canonical file(s). See registry_check.py
# docstring for full rationale; migration/mapping.csv is the source of truth
# for what's still unbatched within a domain.

